# 1s scrape: NFR-3 measures invariant-check lag at <= 1s, so a slower scrape
# would make the metric unable to demonstrate its own target.
global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: ledger
    static_configs:
      - targets: ["host.docker.internal:8080"]
    metrics_path: /metrics
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
