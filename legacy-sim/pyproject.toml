[project]
name = "legacy-sim"
version = "0.1.0"
description = "Deterministic simulated legacy core with twelve seeded quirks."
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legacy_sim"]
