version: "2"
run:
  timeout: 3m
linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - gosec
    - bodyclose
    - errorlint
  settings:
    gosec:
      excludes:
        - G404  # deterministic seeded RNG is a requirement here (NFR-5), not a weakness
formatters:
  enable:
    - gofmt
