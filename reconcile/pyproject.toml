[project]
name = "reconcile"
version = "0.1.0"
description = "Multi-grain reconciliation, break classification and time-to-discovery."
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2", "PyYAML>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reconcile"]
