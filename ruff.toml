line-length = 100
# Generated code is checked in (D-013) but is not ours to style.
extend-exclude = ["gen", ".venv"]
target-version = "py312"
src = ["legacy-sim/src", "reconcile/src", "report/src"]

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "PTH", "RUF"]
ignore = ["E501"]

[lint.per-file-ignores]
"**/tests/**" = ["T20"]
# The simulator's clock is SIMULATED. Its instants are civil times inside a
# modelled business day, not moments in the real world, and attaching a timezone
# would assert something untrue about them. Determinism (NFR-5) is enforced by
# never calling now() at all -- see legacy_sim.generator -- not by tz-awareness.
# scripts/ are CLI tools whose whole output IS stdout.
"scripts/**" = ["T20"]
"legacy-sim/**" = ["DTZ"]
"reconcile/**" = ["DTZ"]
