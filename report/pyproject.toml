[project]
name = "report"
version = "0.1.0"
description = "Renders reports/FINDINGS.md from run artefacts. Never hand-edited."
requires-python = ">=3.12"
dependencies = ["Jinja2>=3.1", "psycopg[binary]>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/report"]
