# uv workspace root. The three members have genuinely different dependency
# sets (only `report` needs Jinja2), which is why this is a workspace and not
# one package -- LLD §1.
[tool.uv.workspace]
members = ["legacy-sim", "reconcile", "report"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "mypy>=1.13",
    "ruff>=0.8",
]
