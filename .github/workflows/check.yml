name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: astral-sh/setup-uv@v3
      - name: Start single-node infra
        run: docker compose --profile single up -d --wait
      - name: make check
        run: make check
      - name: Teardown
        if: always()
        run: docker compose --profile single down -v
