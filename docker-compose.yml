# SHADOWBOOK compose. Two profiles:
#   single -- one broker, two Postgres, Prometheus. Everything except ablation.
#   chaos  -- three brokers with the NFR-9 durability settings, for Finding 2.
#
# Images are pinned to immutable patch tags and MUST be re-pinned to digests
# before the repo goes public: run scripts/pin-digests.sh. See decisions.md
# D-017 for why they are not digests already.

x-pg-common: &pg-common
  image: postgres:16.13-bookworm
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 5s
    retries: 12

# NFR-9 is FIXED for every run and is asserted by a test, not just written here:
# acks=all (producer side, T-013), RF=3, min.insync.replicas=2, unclean leader
# election off. Changing any of these invalidates every ablation artefact.
x-redpanda-common: &redpanda-common
  image: redpandadata/redpanda:v24.3.6
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
    interval: 10s
    timeout: 5s
    retries: 20

services:
  ledger-db:
    <<: *pg-common
    profiles: ["single", "chaos"]
    environment:
      POSTGRES_USER: ${LEDGER_DB_USER:-shadowbook}
      POSTGRES_PASSWORD: ${LEDGER_DB_PASSWORD:?set LEDGER_DB_PASSWORD in .env}
      POSTGRES_DB: ledger
    ports: ["5433:5432"]
    volumes: ["ledger-data:/var/lib/postgresql/data"]

  recon-db:
    <<: *pg-common
    profiles: ["single", "chaos"]
    environment:
      POSTGRES_USER: ${RECON_DB_USER:-shadowbook}
      POSTGRES_PASSWORD: ${RECON_DB_PASSWORD:?set RECON_DB_PASSWORD in .env}
      POSTGRES_DB: recon
    ports: ["5434:5432"]
    volumes: ["recon-data:/var/lib/postgresql/data"]

  # --- single-broker profile -------------------------------------------------
  redpanda:
    <<: *redpanda-common
    profiles: ["single"]
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    ports: ["9092:9092", "9644:9644"]

  # --- chaos profile: three brokers ------------------------------------------
  #
  # No --set flags here, deliberately. `--set redpanda.X` writes NODE config,
  # and every property this profile used to set is a CLUSTER property:
  #
  #   enable_idempotence            cluster, defaults true  -- and rpk passes
  #                                 this one through to the broker binary,
  #                                 which rejects it and restart-loops
  #   enable_transactions           cluster, defaults true
  #   default_topic_replications    cluster, defaults 1
  #   minimum_topic_replications    cluster
  #   unclean_leader_election_...   does not exist in Redpanda at all; that is
  #                                 a Kafka property name and was always inert
  #
  # The two guarantees the ablation actually needs are held elsewhere and are
  # verified rather than asserted: idempotent produce is a franz-go producer
  # option (internal/broker/kafka.go), and replication factor 3 is passed
  # explicitly at topic creation by the runner (Cluster.Replicas). Anything
  # genuinely needed at cluster scope belongs in `rpk cluster config set`
  # after start-up, not in a start flag that is silently ignored.
  redpanda-1: &rp1
    <<: *redpanda-common
    profiles: ["chaos"]
    # Explicit, because the chaos schedule kills brokers BY NAME. Compose
    # would otherwise generate <project>-redpanda-1-1, `docker kill redpanda-1`
    # would fail, and a failed kill is recorded rather than fatal -- so the
    # ablation would run with no chaos at all and report three identical rows.
    container_name: redpanda-1
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=1
      - --check=false
      # Two listeners, because the brokers are reached from two places.
      # INTERNAL is how the brokers and the container network reach each
      # other; EXTERNAL is how the harness on the HOST reaches them. A
      # single listener advertising redpanda-1:9092 bootstraps fine from
      # the host and then hands back a hostname the host cannot resolve,
      # so every produce fails after a successful connection.
      - --kafka-addr=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr=INTERNAL://redpanda-1:9092,EXTERNAL://localhost:19092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda-1:33145
      # enable_idempotence is deliberately NOT set here. rpk consumes every
      # other --set flag into redpanda.yaml but passes this one through to the
      # broker binary, which rejects it -- "unrecognised option" -- and the
      # container restart-loops. Idempotent produce is on by default in v24 and
      # franz-go requests it per-producer regardless (see internal/broker),
      # so nothing is lost by omitting it.
    ports: ["19092:19092"]

  redpanda-2:
    <<: *redpanda-common
    profiles: ["chaos"]
    # Explicit, because the chaos schedule kills brokers BY NAME. Compose
    # would otherwise generate <project>-redpanda-2-1, `docker kill redpanda-2`
    # would fail, and a failed kill is recorded rather than fatal -- so the
    # ablation would run with no chaos at all and report three identical rows.
    container_name: redpanda-2
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=2
      - --check=false
      # Two listeners, because the brokers are reached from two places.
      # INTERNAL is how the brokers and the container network reach each
      # other; EXTERNAL is how the harness on the HOST reaches them. A
      # single listener advertising redpanda-2:9092 bootstraps fine from
      # the host and then hands back a hostname the host cannot resolve,
      # so every produce fails after a successful connection.
      - --kafka-addr=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      - --advertise-kafka-addr=INTERNAL://redpanda-2:9092,EXTERNAL://localhost:29092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda-2:33145
      - --seeds=redpanda-1:33145
      # enable_idempotence is deliberately NOT set here. rpk consumes every
      # other --set flag into redpanda.yaml but passes this one through to the
      # broker binary, which rejects it -- "unrecognised option" -- and the
      # container restart-loops. Idempotent produce is on by default in v24 and
      # franz-go requests it per-producer regardless (see internal/broker),
      # so nothing is lost by omitting it.
    ports: ["29092:29092"]
    depends_on: [redpanda-1]

  redpanda-3:
    <<: *redpanda-common
    profiles: ["chaos"]
    # Explicit, because the chaos schedule kills brokers BY NAME. Compose
    # would otherwise generate <project>-redpanda-3-1, `docker kill redpanda-3`
    # would fail, and a failed kill is recorded rather than fatal -- so the
    # ablation would run with no chaos at all and report three identical rows.
    container_name: redpanda-3
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=3
      - --check=false
      # Two listeners, because the brokers are reached from two places.
      # INTERNAL is how the brokers and the container network reach each
      # other; EXTERNAL is how the harness on the HOST reaches them. A
      # single listener advertising redpanda-3:9092 bootstraps fine from
      # the host and then hands back a hostname the host cannot resolve,
      # so every produce fails after a successful connection.
      - --kafka-addr=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:39092
      - --advertise-kafka-addr=INTERNAL://redpanda-3:9092,EXTERNAL://localhost:39092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda-3:33145
      - --seeds=redpanda-1:33145
      # enable_idempotence is deliberately NOT set here. rpk consumes every
      # other --set flag into redpanda.yaml but passes this one through to the
      # broker binary, which rejects it -- "unrecognised option" -- and the
      # container restart-loops. Idempotent produce is on by default in v24 and
      # franz-go requests it per-producer regardless (see internal/broker),
      # so nothing is lost by omitting it.
    ports: ["39092:39092"]
    depends_on: [redpanda-1]

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["single", "chaos"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2h
    volumes:
      - ./scripts/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

volumes:
  ledger-data:
  recon-data:
